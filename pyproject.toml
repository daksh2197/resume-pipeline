[project]
name = "resume-pipeline"
version = "0.1.0"
description = "Rank a daily list of job leads against your own rubric, then draft a tailored application. You press send."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
screen = "resume_pipeline.cli:screen_main"
pack = "resume_pipeline.cli:pack_main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/resume_pipeline/report.py" = ["E501"]  # the HTML and CSS template lives in one string
